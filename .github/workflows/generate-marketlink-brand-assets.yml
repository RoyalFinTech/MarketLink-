name: Generate MarketLink brand image sizes

on:
  push:
    branches: [main]
    paths:
      - "frontend/assets/marketlink-logo.png"
      - "scripts/generate_marketlink_brand_assets.py"
      - ".github/workflows/generate-marketlink-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketlink-brand-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MarketLink
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate PWA, Apple and social image files
        run: python scripts/generate_marketlink_brand_assets.py

      - name: Commit generated brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/marketlink-app-icon-192.png \
            frontend/assets/marketlink-app-icon-512.png \
            frontend/assets/marketlink-app-icon-maskable-192.png \
            frontend/assets/marketlink-app-icon-maskable-512.png \
            frontend/assets/apple-touch-icon-180.png \
            frontend/assets/favicon-32.png \
            frontend/assets/marketlink-og-preview.jpg
          if git diff --cached --quiet; then
            echo "Generated image assets are already current."
          else
            git commit -m "Generate square MarketLink app icons and social preview"
            git push origin HEAD:main
          fi
