name: MarketLink frontend JavaScript syntax
on:
  push:
    branches: [main]
    paths:
      - "frontend/**/*.js"
      - ".github/workflows/marketlink-frontend-syntax.yml"
  pull_request:
    paths:
      - "frontend/**/*.js"
      - ".github/workflows/marketlink-frontend-syntax.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every frontend JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          find frontend -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
