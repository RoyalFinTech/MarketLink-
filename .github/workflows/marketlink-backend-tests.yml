name: MarketLink backend tests
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/marketlink-backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/marketlink-backend-tests.yml']
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
