name: MarketLink backend tests
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/marketlink-backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/marketlink-backend-tests.yml']
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - name: Parse financial and rider modules
        run: |
          node --check src/modules/payments/service.js
          node --check src/modules/payments/controller.js
          node --check src/modules/payments/routes.js
          node --check src/modules/orders/service.js
          node --check src/modules/wallets/service.js
          node --check src/modules/withdrawals/service.js
          node --check src/modules/delivery/service.js
          node --check src/modules/riders/service.js
          node --check src/modules/riders/routes.js
